<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股市場雷達 · 財經簡報書架</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --soft: #f8fafc;
      --navy: #0f172a;
      --blue: #1e3a8a;
      --blue-hover: #172e6e;
      --text: #1f2937;
      --muted: #64748b;
      --border: #e2e8f0;
      --pre-bg: #dbeafe;
      --pre-text: #1e40af;
      --post-bg: #e2e8f0;
      --post-text: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* 頂部橫幅 */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 20px 26px;
      border-bottom: 3px solid #3b82f6;
    }

    .hero-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .hero-eyebrow {
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .hero-sub {
      font-size: 12.5px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .hero-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quick-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      transition: background 0.15s ease;
    }

    .quick-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .quick-btn.primary {
      background: #2563eb;
      border-color: #60a5fa;
    }

    .quick-btn.primary:hover {
      background: #1d4ed8;
    }

    /* 主內容雙欄 */
    .layout {
      max-width: 1320px;
      width: 100%;
      margin: 18px auto 28px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 18px;
      flex: 1;
      align-items: start;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .viewer-panel { display: none; }
      .viewer-panel.mobile-active { display: block; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    /* 左側報表清單 */
    .sidebar-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--soft);
    }

    .search-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 8px 11px;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .filter-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: #475569;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--navy);
      color: #ffffff;
      border-color: var(--navy);
    }

    .report-list {
      max-height: 74vh;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .report-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .report-card:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .report-card.selected {
      border-color: var(--blue);
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.12);
    }

    .rc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .mode-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
    }
    .mode-premarket { background: var(--pre-bg); color: var(--pre-text); }
    .mode-postmarket { background: var(--post-bg); color: var(--post-text); }
    .mode-other { background: #fef3c7; color: #92400e; }

    .rc-date {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .rc-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .rc-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .rc-links {
      display: flex;
      gap: 8px;
    }

    .rc-links a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    .rc-links a:hover { text-decoration: underline; }

    /* 右側 PDF 閱讀器 */
    .viewer-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--soft);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .viewer-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--navy);
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
    }

    .vbtn {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
    }

    .vbtn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .pdf-frame {
      width: 100%;
      height: 76vh;
      min-height: 620px;
      border: none;
      background: #e2e8f0;
      display: block;
    }

    .empty-state {
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }

    footer {
      text-align: center;
      padding: 14px 20px;
      font-size: 11.5px;
      color: #94a3b8;
      border-top: 1px solid var(--border);
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <div class="hero-eyebrow">TW MARKET RADAR · STATIC PDF ARCHIVE</div>
        <h1 class="hero-title">台股市場雷達 · 財經簡報書架</h1>
        <div class="hero-sub">每日盤前雷達與盤後覆盤 A4 PDF 財經簡報歸檔｜共收錄 2 份簡報</div>
      </div>
      <div class="hero-quick">
        
        <a class="quick-btn primary" href="pdfs/2026-11-25_postmarket.pdf" target="_blank" rel="noopener">
          最新盤後覆盤（2026-11-25）↗
        </a>
        
        
        <a class="quick-btn" href="pdfs/2026-11-25_premarket.pdf" target="_blank" rel="noopener">
          最新盤前雷達（2026-11-25）↗
        </a>
        
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- 左側篩選與報表列表 -->
    <aside class="panel">
      <div class="sidebar-head">
        <input type="search" id="searchInput" class="search-input" placeholder="搜尋日期或關鍵字（例如 2026-11）..." />
        <div class="filter-tabs">
          <button type="button" class="filter-btn active" data-filter="all">全部 (2)</button>
          <button type="button" class="filter-btn" data-filter="premarket">盤前雷達</button>
          <button type="button" class="filter-btn" data-filter="postmarket">盤後覆盤</button>
        </div>
      </div>
      <div id="reportList" class="report-list"></div>
    </aside>

    <!-- 右側 PDF 內嵌預覽器 -->
    <section class="panel viewer-panel" id="viewerPanel">
      <div class="viewer-head">
        <div>
          <div class="viewer-title" id="viewerTitle">請從左側選擇一份財經簡報</div>
          <div style="font-size: 11.5px; color: var(--muted);" id="viewerMeta"></div>
        </div>
        <div class="viewer-actions">
          <a class="vbtn primary" id="btnOpenTab" href="#" target="_blank" rel="noopener" style="display:none;">全螢幕開啟 ↗</a>
          <a class="vbtn" id="btnDownload" href="#" download style="display:none;">下載 PDF</a>
        </div>
      </div>
      <div id="viewerBody">
        <div class="empty-state">尚未選取任何報表</div>
      </div>
    </section>
  </main>

  <footer>
    由 GitHub Pages PDF 簡報發布工具自動建置｜最後更新時間：<span class="tabular-nums">2026-11-25 22:49</span>｜僅供個人研究參考，不構成投資建議
  </footer>

  <script>
    const REPORTS = [{"filename": "2026-11-25_postmarket.pdf", "report_date": "2026-11-25", "mode": "postmarket", "mode_label": "盤後覆盤", "display_title": "2026-11-25 台股盤後覆盤", "size_kb": 1469.4, "updated_at": "2026-11-25 22:47", "pdf_rel_path": "pdfs/2026-11-25_postmarket.pdf"}, {"filename": "2026-11-25_premarket.pdf", "report_date": "2026-11-25", "mode": "premarket", "mode_label": "盤前雷達", "display_title": "2026-11-25 台股盤前雷達", "size_kb": 1132.8, "updated_at": "2026-11-25 16:45", "pdf_rel_path": "pdfs/2026-11-25_premarket.pdf"}];
    let currentFilter = "all";
    let currentKeyword = "";
    let selectedFilename = REPORTS.length ? REPORTS[0].filename : "";

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getFilteredReports() {
      return REPORTS.filter((r) => {
        if (currentFilter !== "all" && r.mode !== currentFilter) return false;
        if (currentKeyword) {
          const hay = `${r.display_title} ${r.filename} ${r.report_date} ${r.mode_label}`.toLowerCase();
          if (!hay.includes(currentKeyword)) return false;
        }
        return true;
      });
    }

    function selectReport(filename) {
      const target = REPORTS.find((r) => r.filename === filename);
      if (!target) return;
      selectedFilename = target.filename;

      document.getElementById("viewerTitle").textContent = target.display_title;
      document.getElementById("viewerMeta").textContent = `${target.mode_label} · ${target.filename} · ${target.size_kb} KB · 更新於 ${target.updated_at}`;

      const pdfUrl = encodeURI(target.pdf_rel_path);
      const openBtn = document.getElementById("btnOpenTab");
      const dlBtn = document.getElementById("btnDownload");
      openBtn.href = pdfUrl;
      openBtn.style.display = "inline-flex";
      dlBtn.href = pdfUrl;
      dlBtn.download = target.filename;
      dlBtn.style.display = "inline-flex";

      document.getElementById("viewerBody").innerHTML = `
        <iframe class="pdf-frame" src="${pdfUrl}#view=FitH" title="${escapeHtml(target.display_title)}"></iframe>
      `;
      renderList();
    }

    function renderList() {
      const box = document.getElementById("reportList");
      const list = getFilteredReports();
      if (!list.length) {
        box.innerHTML = `<div class="empty-state">找不到符合條件的 PDF 簡報</div>`;
        return;
      }

      box.innerHTML = list.map((r) => {
        const isSel = r.filename === selectedFilename;
        const pillCls = r.mode === "premarket" ? "mode-premarket" : (r.mode === "postmarket" ? "mode-postmarket" : "mode-other");
        const pdfUrl = encodeURI(r.pdf_rel_path);
        return `
          <div class="report-card ${isSel ? "selected" : ""}" onclick="selectReport('${escapeHtml(r.filename)}')">
            <div class="rc-top">
              <span class="mode-pill ${pillCls}">${escapeHtml(r.mode_label)}</span>
              <span class="rc-date tabular-nums">${escapeHtml(r.report_date)}</span>
            </div>
            <div class="rc-title">${escapeHtml(r.display_title)}</div>
            <div class="rc-foot">
              <span class="tabular-nums">${r.size_kb} KB</span>
              <div class="rc-links" onclick="event.stopPropagation();">
                <a href="${pdfUrl}" target="_blank" rel="noopener">開啟</a>
                <a href="${pdfUrl}" download="${escapeHtml(r.filename)}">下載</a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      currentKeyword = (e.target.value || "").trim().toLowerCase();
      renderList();
    });

    renderList();
    if (selectedFilename) {
      selectReport(selectedFilename);
    }
  </script>
</body>
</html>
